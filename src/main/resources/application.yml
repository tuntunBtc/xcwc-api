server:
  servlet:
    context-path: /
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
      location: ${MULTIPART_TMP_DIR:${java.io.tmpdir}}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/xcwh?connectionTimeZone=UTC}
    username: ${DB_USERNAME:yanji}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jackson:
    time-zone: UTC
  mvc:
    log-request-details: false
app:
  analytics:
    admin-token: ${ANALYTICS_ADMIN_TOKEN:}
  checkins:
    directory: ${CHECKIN_STORAGE_DIR:./data/checkins}
  provision-count: 0
  wx:
    app-id: ${WX_APP_ID:}
    legacy-app-id: ${WX_LEGACY_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    phone-login-enabled: ${WX_PHONE_LOGIN_ENABLED:true}
    step-unit: 1000
    step-daily-cap: 5
    supply-enabled: ${WX_SUPPLY_ENABLED:false}
    supply-steps: ${WX_SUPPLY_STEPS:3000}
    debug: false
    debug-code: DEBUG_CODE
    debug-openid: debug_openid
    debug-session-key: ${WX_DEBUG_SESSION_KEY:}

mybatis:
  type-aliases-package: com.ruoyi.common.core.domain.entity,com.ruoyi.system.domain
  mapper-locations: classpath*:mapper/system/*Mapper.xml
management-upload:
  video-enabled: ${OSS_UPLOAD_VIDEO_ENABLED:false}
  ffprobe-command: ${OSS_UPLOAD_FFPROBE_COMMAND:ffprobe}
  directory: ${OSS_UPLOAD_TMP_DIR:${java.io.tmpdir}}
  enabled: ${OSS_UPLOAD_ENABLED:false}
  public-base-url: ${OSS_UPLOAD_PUBLIC_BASE_URL:}
management-content:
  animation-editing: ${CONTENT_ANIMATION_EDITING:false}
  migrate-local-to-oss: ${CONTENT_OSS_MIGRATE:false}
  storage: ${CONTENT_STORAGE:local}
  oss:
    credentials: ${CONTENT_OSS_CREDENTIALS:ecs}
    bucket: ${CONTENT_OSS_BUCKET:}
    region: ${CONTENT_OSS_REGION:cn-hangzhou}
    endpoint: ${CONTENT_OSS_ENDPOINT:https://oss-cn-hangzhou-internal.aliyuncs.com}
    role-name: ${CONTENT_OSS_ROLE_NAME:}
    prefix: ${CONTENT_OSS_PREFIX:content/}
  directory: ${CONTENT_STORAGE_DIR:./data/content}
admin:
  bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: "local | acceptance"
  flyway:
    enabled: false
