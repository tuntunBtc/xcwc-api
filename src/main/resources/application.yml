server:
  servlet:
    context-path: /
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yanji?connectionTimeZone=UTC}
    username: ${DB_USERNAME:yanji}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jackson:
    time-zone: UTC
  mvc:
    log-request-details: false
app:
  checkins:
    directory: ${CHECKIN_STORAGE_DIR:./data/checkins}
  provision-count: 0
