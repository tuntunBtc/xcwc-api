components:
  headers:
    ShopCacheControl:
      description: 公开商城成功响应可缓存 60 秒；过期后须重新验证。其他接口与错误响应沿用 no-store。
      schema:
        type: string
        example: public, max-age=60, must-revalidate
    ShopETag:
      description: 当前响应 JSON 表示的弱 SHA-256 校验值；筛选、分页或商品资料变化导致表示变化时更新。
      schema:
        type: string
        example: W/"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 随机不透明令牌，不是 JWT；数据库仅存摘要
    analyticsAdmin:
      type: http
      scheme: bearer
      description: 独立后台密钥，由服务端 ANALYTICS_ADMIN_TOKEN 配置；不可使用普通账号会话令牌。
    adminBearer:
      type: http
      scheme: bearer
      description: 独立管理会话，adm_ 前缀；不接受小程序令牌。
    previewToken:
      type: apiKey
      in: header
      name: X-Preview-Token
      description: 授权生成的 15 分钟只读草稿凭据；不记录至 URL 或日志。
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次 ETag；支持弱比较、逗号分隔列表和 *。先校验查询及商品存在性，再判断是否返回 304。
      schema:
        type: string
    BirdId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 32 位小写十六进制随机公开 ID；未知 ID 返回 404
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - username
            - password
            properties:
              username:
                type: string
                pattern: ^[a-z0-9_]{4,32}$
              password:
                type: string
                minLength: 10
                maxLength: 72
                description: 同时要求 UTF-8 编码最多 72 字节；密码不可找回
  schemas:
    WechatStepProgressRequest:
      type: object
      required: [encryptedData, iv]
      properties:
        encryptedData:
          type: string
          minLength: 1
          maxLength: 16384
        iv:
          type: string
          minLength: 1
          maxLength: 64
    WechatStepProgress:
      type: object
      required: [date, steps, stepPointsAvailable, stepPointsRedeemed, granted, replayed]
      properties:
        date:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
        stepPointsAvailable:
          type: integer
          minimum: 0
          description: 按本次验证步数计算，当前尚可兑换的叽分
        stepPointsRedeemed:
          type: integer
          minimum: 0
          description: 账号今日已从步数兑换的叽分总数
        granted:
          type: integer
          minimum: 0
          description: 当前请求首次入账的额度，已入账请求重试时返回原额度
        replayed:
          type: boolean
          description: 当前请求是否返回既有入账回执
    CloudAdoption:
      type: object
      additionalProperties: false
      required:
      - requestId
      - birdId
      - nickname
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        birdId:
          type: string
          pattern: ^[0-9a-f]{32}$
        nickname:
          type: string
          minLength: 1
          maxLength: 6
    CloudAction:
      type: object
      additionalProperties: false
      required:
      - requestId
      - expectedVersion
      - action
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        expectedVersion:
          type: string
          pattern: ^[0-9]{1,18}$
        action:
          type: string
          enum:
          - RENAME
          - FEED
          - WATER
          - PET
          - CLEAN
          - CLAIM_SUPPLY
        nickname:
          type: string
          minLength: 1
          maxLength: 6
          description: Only for RENAME.
        expectedDate:
          type: string
          format: date
          description: Required for CLAIM_SUPPLY; server Asia/Shanghai business date.
    CloudWallet:
      type: object
      required:
      - balance
      - accountVersion
      properties:
        balance:
          type: integer
          format: int64
        accountVersion:
          type: string
    CloudPet:
      type: object
      required:
      - petId
      - birdId
      - nickname
      - active
      - version
      - ruleVersion
      - serverTime
      - businessDate
      - care
      - inventory
      - cleaning
      - supplyClaimed
      properties:
        petId:
          type: string
        birdId:
          type: string
        birdCode:
          type: string
          nullable: true
        nickname:
          type: string
        active:
          type: boolean
        version:
          type: string
        ruleVersion:
          type: string
          enum:
          - normal-v1
        serverTime:
          type: string
          format: date-time
        businessDate:
          type: string
          format: date
        care:
          type: object
          required:
          - satiety
          - hydration
          - mood
          - lastCompanionAt
          properties:
            satiety:
              type: integer
              minimum: 0
              maximum: 100
            hydration:
              type: integer
              minimum: 0
              maximum: 100
            mood:
              type: integer
              minimum: 20
              maximum: 100
            lastCompanionAt:
              type: string
              format: date-time
        inventory:
          type: object
          required:
          - food
          - water
          properties:
            food:
              type: integer
              minimum: 0
            water:
              type: integer
              minimum: 0
        cleaning:
          type: object
          required:
          - type
          - status
          - dueAt
          properties:
            type:
              type: string
              enum:
              - POOP
            status:
              type: string
              enum:
              - NONE
              - PENDING
              - PRESENT
            dueAt:
              type: string
              format: date-time
              nullable: true
        supplyClaimed:
          type: boolean
        characterId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,32}$
          nullable: true
        contentVersion:
          type: string
          nullable: true
    CloudDetail:
      type: object
      required:
      - pet
      - wallet
      properties:
        pet:
          $ref: '#/components/schemas/CloudPet'
        wallet:
          $ref: '#/components/schemas/CloudWallet'
    CloudResult:
      type: object
      required:
      - requestId
      - replayed
      - outcome
      - pet
      - wallet
      properties:
        requestId:
          type: string
        replayed:
          type: boolean
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - ALREADY_FULL
          - ALREADY_CLAIMED
        created:
          type: boolean
          description: 仅领养回执提供；原操作是否创建云端宠物，重放时仍保留原值。HTTP 重放始终为 200。
        changed:
          type: boolean
        reward:
          type: integer
          minimum: 0
          maximum: 1
        pet:
          $ref: '#/components/schemas/CloudPet'
        wallet:
          $ref: '#/components/schemas/CloudWallet'
    CloudList:
      type: object
      required:
      - userId
      - serverTime
      - items
      - wallet
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        serverTime:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CloudPet'
        wallet:
          $ref: '#/components/schemas/CloudWallet'
    InventoryEntry:
      type: object
      required:
      - id
      - requestId
      - operation
      - foodDelta
      - waterDelta
      - foodAfter
      - waterAfter
      - createdAt
      properties:
        id:
          type: string
        requestId:
          type: string
        operation:
          type: string
          enum:
          - INITIAL
          - FEED
          - WATER
          - CLAIM_SUPPLY
        foodDelta:
          type: integer
        waterDelta:
          type: integer
        foodAfter:
          type: integer
        waterAfter:
          type: integer
        createdAt:
          type: string
          format: date-time
    SupplyClaim:
      type: object
      required:
      - date
      - petId
      - requestId
      - food
      - water
      - createdAt
      properties:
        date:
          type: string
          format: date
        petId:
          type: string
        requestId:
          type: string
        food:
          type: integer
          enum:
          - 1
        water:
          type: integer
          enum:
          - 1
        createdAt:
          type: string
          format: date-time
    WechatSupplyRequest:
      type: object
      required:
      - encryptedData
      - iv
      - installationId
      - birdCode
      properties:
        encryptedData:
          type: string
          minLength: 1
          maxLength: 16384
        iv:
          type: string
          minLength: 1
          maxLength: 64
        installationId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: 本机安装随机标识，清除本机数据后不再恢复旧回执
        birdCode:
          type: string
          maxLength: 32
          pattern: ^[A-Z]{2}-[A-Z][A-Z0-9]{1,7}-[1-9][0-9]{0,18}$
    ShopProduct:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - cityCode
      - cityName
      - remark
      - price
      - coverImageUrl
      - detailImageUrl
      - purchaseUrl
      - sortOrder
      - cartHotspot
      - coverCrop
      - detailCrop
      - closeHotspot
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
          description: 稳定商品 ID，用于详情关联与购物车去重；不使用实体 birdId
        title:
          type: string
          minLength: 1
          maxLength: 80
        cityCode:
          type: string
          pattern: ^[a-z0-9_-]{1,32}$
        cityName:
          type: string
          minLength: 1
          maxLength: 32
        remark:
          type: string
          maxLength: 80
          description: 备注可为空串
        price:
          type: number
          minimum: 0.01
          maximum: 999999.99
          multipleOf: 0.01
          example: 79.0
          description: 人民币元，JSON number，最多两位小数；当前资料按用户确认统一为 79.00，不以此示例自动上架
        coverImageUrl:
          type: string
          maxLength: 1024
          pattern: ^/assets/[A-Za-z0-9][A-Za-z0-9_./-]*\.(png|jpg|jpeg|webp|avif)$
          description: 同站点公开素材路径，拒绝目录穿越和外部域名
        detailImageUrl:
          type: string
          maxLength: 1024
          pattern: ^/assets/[A-Za-z0-9][A-Za-z0-9_./-]*\.(png|jpg|jpeg|webp|avif)$
          description: 每款商品独立的一张完整详情长图；前端不再逐项拼接详情标题、描述与价格等细图
        purchaseUrl:
          type: string
          nullable: true
          format: uri
          maxLength: 2048
          description: 未配置真实购买链接时为 null，商品仍可展示和加购，前端禁用该商品购买按钮并提示链接待配置。非 null 时仅允许
            HTTPS 的 e.tb.cn、item.taobao.com、detail.tmall.com，禁止用户名信息和非标准端口。购买不触发站内支付或发蛋
        sortOrder:
          type: integer
          minimum: 0
        cartHotspot:
          $ref: '#/components/schemas/ShopCartHotspot'
        coverCrop:
          $ref: '#/components/schemas/ShopImageRect'
        detailCrop:
          $ref: '#/components/schemas/ShopImageRect'
        closeHotspot:
          $ref: '#/components/schemas/ShopCloseHotspot'
    ShopCloseHotspot:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 完整详情图内关闭按钮的透明点击区，相对 detailCrop 裁后展示图的宽高比例。复用图片范围校验；省略时使用兼容原四款截图的默认位置，每款不同布局可独立配置。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
          default: 0.837
        top:
          type: number
          minimum: 0
          maximum: 1
          default: 0.0555
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.085
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.046
    ShopImageRect:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 仅影响前端显示窗口，不改写原图。裁剪相对原文件宽高的 0–1 比例，范围不可超出图片；缺省返回整图 (0,0,1,1)。cartHotspot
        与 closeHotspot 坐标均相对于 detailCrop 裁后展示的完整详情图。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
        top:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
    ShopCartHotspot:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 完整详情长图已含加购按钮，前端仅叠加透明点击区。坐标均为图片宽高的 0–1 比例；left+width、top+height
        不可超过 1。配置省略时归一为默认定稿位置。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
          default: 0.08
        top:
          type: number
          minimum: 0
          maximum: 1
          default: 0.87
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.84
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.08
    ShopProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      - cities
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShopProduct'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        cities:
          type: array
          items:
            type: object
            required:
            - code
            - name
            properties:
              code:
                type: string
              name:
                type: string
    ShopBanner:
      type: object
      additionalProperties: false
      required:
      - id
      - imageUrl
      - alt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        imageUrl:
          type: string
          maxLength: 1024
          description: 同站点 /assets/ 公开图片路径
        alt:
          type: string
          minLength: 1
          maxLength: 120
          description: 仅作图片替代文字，轮播图不含跳转链接
    ShopError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_SHOP_QUERY
          - SHOP_PRODUCT_NOT_FOUND
        message:
          type: string
    Bird:
      type: object
      required:
      - id
      - typeId
      - name
      - claimed
      - image
      properties:
        id:
          type: string
        birdCode:
          type: string
          nullable: true
          maxLength: 32
          description: 新版 NFC 编码；旧数据为 null，不替换 id 或静默重编号
        ipCode:
          type: string
          nullable: true
          example: HY
        codeCity:
          type: string
          nullable: true
          example: HZ
        imagePath:
          type: string
          description: 出厂素材路径，与 image 一致
        active:
          type: boolean
          description: 实体是否启用；停用后公开查询返回 410 BIRD_INACTIVE
        typeId:
          type: string
          example: yanji_blue
        name:
          type: string
        claimed:
          type: boolean
          description: 兼容字段：公开查询恒 false，本人名单恒 true；不得据此判断其他账号能否领养
        claimedAt:
          type: string
          format: date-time
          nullable: true
        cityCode:
          type: string
          example: hangzhou
        cityName:
          type: string
          example: 杭州
        typeName:
          type: string
          example: 高透白洁
        skinId:
          type: string
          example: demo_white
        skinName:
          type: string
          example: 测试白色皮肤
        batchNo:
          type: string
          example: DEMO-202610
        image:
          type: string
          example: /miniprogram/assets/bird_calm.png
    PointsRequest:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
          description: 客户端生成，失败重试沿用原编号；同账号不可用于不同操作。
    PointsWallet:
      type: object
      required:
      - balance
      - date
      - earnedToday
      - dailyLimit
      - nextRewardAt
      properties:
        balance:
          type: integer
          format: int64
        date:
          type: string
          format: date
        earnedToday:
          type: integer
        dailyLimit:
          type: integer
          enum:
          - 10
        nextRewardAt:
          type: string
          format: date-time
          nullable: true
    PointsEntry:
      type: object
      required:
      - id
      - operation
      - targetId
      - delta
      - balanceAfter
      - createdAt
      properties:
        id:
          type: string
          description: 流水游标，字符串避免 JavaScript 大整数精度问题
        operation:
          type: string
          enum:
          - PET
          - REDEEM
          - CHECKIN_REWARD
          - WELCOME
          - STEPS
        targetId:
          type: string
        delta:
          type: integer
        balanceAfter:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    PointsChange:
      type: object
      required:
      - entry
      - replayed
      properties:
        entry:
          $ref: '#/components/schemas/PointsEntry'
        replayed:
          type: boolean
          description: true 为重放原结算，不代表当前余额；用 GET /me/points 刷新余额
    RewardSkin:
      type: object
      required:
      - id
      - name
      - price
      - visualKey
      - owned
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
        visualKey:
          type: string
          enum:
          - lake
          - sunset
        owned:
          type: boolean
    Outfit:
      type: object
      additionalProperties: false
      properties:
        petId: *id023
        characterId: *id024
        version: *id009
        appearanceId: *id024
        accessories: &id029
          type: object
          additionalProperties: *id024
      required:
      - petId
      - characterId
      - version
      - appearanceId
      - accessories
    EquipSkin:
      type: object
      properties:
        skinId:
          type: string
          nullable: true
          pattern: ^[a-z0-9_]{1,32}$
          description: null 或省略恢复默认外观
    CheckinSubmission:
      type: object
      required:
      - requestId
      - birdIds
      - styleId
      - label
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
          description: 失败原样重试沿用此 ID；不可跨操作复用
        birdIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-f0-9]{32}$
          description: /me/birds 返回的实体 ID，不是款式或城市 ID；同款多实体可各自出镜
        styleId:
          type: string
          enum:
          - natural
          - film
          - soft
          - mono
        label:
          type: string
          maxLength: 20
    CheckinCharacter:
      type: object
      required:
      - key
      - typeId
      - cityCode
      - skinId
      - name
      properties:
        key:
          type: string
        typeId:
          type: string
        cityCode:
          type: string
        skinId:
          type: string
        name:
          type: string
    CheckinWork:
      type: object
      required:
      - id
      - status
      - birdIds
      - styleId
      - label
      - createdAt
      - imageUrl
      - originalUrl
      - reward
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - SUCCEEDED
        birdIds:
          type: array
          items:
            type: string
        styleId:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
        originalUrl:
          type: string
        reward:
          type: integer
          enum:
          - 0
          - 1
          description: 该作品实际已结算奖励；重复原图或限额后为 0，不能客户端假加分
    CheckinPage:
      type: object
      required:
      - items
      - nextCursor
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckinWork'
        nextCursor:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
    UserId:
      type: string
      pattern: ^[0-9a-f]{32}$
      description: 后端 app_user.id；账号持久标识，重新登录或更换设备不重新生成。不是 OpenID、设备 ID 或访问凭证，不能替代
        Bearer 令牌。
    CurrentSession:
      type: object
      required:
      - userId
      - username
      - expiresAt
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
        expiresAt:
          type: string
          format: date-time
    Binding:
      type: object
      required:
      - birdId
      - bound
      properties:
        birdId:
          type: string
        bound:
          type: boolean
        bindingId:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        eggId:
          type: string
          nullable: true
          description: 绑定内唯一鸟蛋权益 ID，与 bindingId 相同
        eggStatus:
          type: string
          nullable: true
          enum:
          - HATCHED
          description: 确认即免费孵化；未绑定为 null
        hatchedAt:
          type: string
          format: date-time
          nullable: true
    AdoptionRequest:
      type: object
      required:
      - requestId
      - name
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        name:
          type: string
          minLength: 1
          maxLength: 6
          description: 去除首尾空白后 1～6 Unicode code points，拒绝控制字符
    ContentCharacter:
      type: object
      additionalProperties: false
      properties:
        id: *id024
        code: *id024
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 500
        defaultAppearanceId: *id024
        backgroundAssetId: &id025
          type: string
          pattern: ^[0-9a-f]{32}$
          nullable: true
        adoptionEnabled: *id019
      required:
      - id
      - code
      - name
      - description
      - defaultAppearanceId
      - adoptionEnabled
    ExpressionSlots:
      type: object
      additionalProperties: false
      properties:
        normal: *id023
        happy: *id023
        hungry: *id023
        thirsty: *id023
        lonely: *id023
        shy: *id023
        angry: *id023
        crying: *id023
        confused: *id023
        veryHappy: *id023
      required:
      - normal
      - happy
      - hungry
      - thirsty
      - lonely
      - shy
      - angry
      - crying
      - confused
      - veryHappy
    SpriteAnimation:
      type: object
