  responses:
    WechatSupplyResult:
      description: 当日补给状态。未达标时 claimed 和 claimable 均为 false，且 receipt 为空。
      content:
        application/json:
          schema:
            type: object
            required:
            - date
            - steps
            - requiredSteps
            - claimed
            - claimable
            - receipt
            properties:
              date:
                type: string
                format: date
              steps:
                type: integer
                minimum: 0
              requiredSteps:
                type: integer
                minimum: 1
              claimed:
                type: boolean
                description: 当前微信账号当天已经领取，无论从哪个安装发起
              claimable:
                type: boolean
                description: 当天达标且尚未领取。新发放还须核验实体未停用。
              receipt:
                type: object
                nullable: true
                required:
                - id
                - date
                - birdCode
                - food
                - water
                description: 已发放且当前安装和小鸟与原记录一致时返回，用于本机幂等入账。
                properties:
                  id:
                    type: string
                    pattern: ^[0-9a-f]{32}$
                  date:
                    type: string
                    format: date
                  birdCode:
                    type: string
                  food:
                    type: integer
                    enum:
                    - 1
                  water:
                    type: integer
                    enum:
                    - 1
    ShopNotModified:
      description: 公开商城表示未变，无正文；缓存策略与 ETag 随响应返回。
      headers:
        Cache-Control:
          $ref: '#/components/headers/ShopCacheControl'
        ETag:
          $ref: '#/components/headers/ShopETag'
    Session:
      description: 令牌只在创建时返回；前端使用 sessionStorage，不放 URL
      content:
        application/json:
          schema:
            type: object
            required:
            - token
            - username
            - expiresAt
            properties:
              token:
                type: string
                pattern: ^[0-9a-f]{64}$
              username:
                type: string
              expiresAt:
                type: string
                format: date-time
    Error:
      description: 业务错误；429 表示应等待后重试；未知服务器错误不暴露内部信息
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
