openapi: 3.0.3
info:
  title: XCWH 小程序与运营后台 API
  version: 1.1.0
  description: XCWH H5：账号密码会话、多账号实体领养和免费立即孵化、叽分与受控合照。保持旧内部 ID；隐藏码不再参与领养。请求 Content-Type
    不受支持时返回 415 和 UNSUPPORTED_MEDIA_TYPE，不视为服务端故障。 小程序云端宠物 GET 为业务只读；未初始化返回 CLOUD_INITIALIZATION_REQUIRED，显式
    POST /me/pets/initialize 后重读。 2026-11-14 增加独立管理鉴权、内容发布、素材与账号永久装扮权益；与商品展示无自动关联。
servers:
- url: /
  description: 使用目标环境的源站。管理接口使用受保护的后台 IP，小鸟接口使用 API 域名；测试后端由网关在路径前加 /test。已发布清单的不可变素材地址仍为 /bird/v1/content/assets/{id}。
paths:
  /bird/v1/me/pets/{petId}/diary:
    parameters:
    - $ref: '#/components/parameters/DiaryPetId'
    get:
      operationId: getPetDiaryCalendar
      summary: 按日期范围查看本鸟日历
      description: 日期以北京时间为准，起止均含，最多 62 天。允许查询日历中的未来日期格，响应只包含已有日记的日期。查询不创建日记。
      tags: [小鸟日记]
      security: &diarySecurity
      - bearer: []
      parameters:
      - { name: from, in: query, required: true, schema: { type: string, format: date } }
      - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 北京时间当天及日历记录，Cache-Control 为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetDiaryCalendar'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /bird/v1/me/pets/{petId}/diary/today:
    parameters:
    - $ref: '#/components/parameters/DiaryPetId'
    post:
      operationId: ensurePetDiaryToday
      summary: 确保本鸟已有当天日记
      description: 使用服务端北京时间生成当前自然日的一篇日记，已生成则返回已有记录。按宠物归属和日期幂等，不生成历史日记。
      tags: [小鸟日记]
      security: *diarySecurity
      responses: &diaryDayResponses
        '200':
          description: 日记、活动和往来信件，Cache-Control 为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetDiaryDay'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /bird/v1/me/pets/{petId}/diary/{date}:
    parameters:
    - $ref: '#/components/parameters/DiaryPetId'
    - $ref: '#/components/parameters/DiaryBusinessDate'
    get:
      operationId: getPetDiaryDay
      summary: 查看当天日记、活动和往来信件
      description: 无日记的日期返回 DIARY_NOT_FOUND。只读，不改变回信状态。
      tags: [小鸟日记]
      security: *diarySecurity
      responses: *diaryDayResponses
  /bird/v1/me/pets/{petId}/diary/{date}/letters:
    parameters:
    - $ref: '#/components/parameters/DiaryPetId'
    - $ref: '#/components/parameters/DiaryBusinessDate'
    post:
      operationId: leavePetDiaryLetter
      summary: 留言并收到一封新回信
      description: 使用同一宠物的同一请求标识和相同内容重试，不会重复留言或回信。相同标识用于其他日期或内容返回 IDEMPOTENCY_CONFLICT。新回信初始未读。
      tags: [小鸟日记]
      security: *diarySecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetDiaryLetterRequest'
      responses:
        <<: *diaryDayResponses
        '409':
          $ref: '#/components/responses/Error'
  /bird/v1/me/pets/{petId}/diary/{date}/letters/{letterId}/read:
    parameters:
    - $ref: '#/components/parameters/DiaryPetId'
    - $ref: '#/components/parameters/DiaryBusinessDate'
    - { name: letterId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
    post:
      operationId: markPetDiaryReplyRead
      summary: 将一封回信标为已读
      description: 按宠物、日期和信件归属逐封更新；重试保留首次已读时间。
      tags: [小鸟日记]
      security: *diarySecurity
      responses: *diaryDayResponses
  /bird/v1/me/pets:
    get:
      operationId: listCloudPets
      summary: listCloudPets
      description: 业务只读，包括 HEAD；仅计算服务端时间衰减投影，不创建库存、流水或开启云端标记。账号或可信绑定未初始化返回 409 CLOUD_INITIALIZATION_REQUIRED。
      security: &listCloudPetsSecurity
      - bearer: []
      responses: &listCloudPetsResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags: &listCloudPetsTags
      - 云端养成
  /bird/v1/me/pets/{petId}:
    get:
      operationId: getCloudPet
      summary: getCloudPet
      description: 业务只读，包括 HEAD；仅计算服务端时间衰减投影，不创建库存、流水或开启云端标记。账号或可信绑定未初始化返回 409 CLOUD_INITIALIZATION_REQUIRED。
      security: &getCloudPetSecurity
      - bearer: []
      responses: &getCloudPetResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters: &getCloudPetParameters
      - &id001
        name: petId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      tags: &getCloudPetTags
      - 云端养成
  /bird/v1/me/pets/adopt:
    post:
      operationId: adoptCloudPet
      summary: adoptCloudPet
      description: Explicit confirmation only; account/entity unique binding, free
        immediate hatch and initial inventory in one transaction. Request IDs are
        unique within cloud operations per account.
      security: &adoptCloudPetSecurity
      - bearer: []
      responses: &adoptCloudPetResponses
        '200':
          description: 已有资源或幂等重放；不重复发放权益
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
          headers:
            Location:
              description: 本人可读取的资源详情相对 URI
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '201':
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
          headers:
            Location:
              description: 本人可读取的资源详情相对 URI
              schema:
                type: string
      requestBody: &adoptCloudPetRequestBody
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAdoption'
      tags: &adoptCloudPetTags
      - 云端养成
  /bird/v1/me/pets/{petId}/actions:
    post:
      operationId: operateCloudPet
      summary: operateCloudPet
      description: 'Replay is checked before version. Retry uncertain results with
        original ID/body; changed payload is IDEMPOTENCY_CONFLICT. PET_VERSION_CONFLICT
        requires refresh and a newly confirmed action. Failed transactions leave no
        receipt. Successful no-ops have receipts. Rewards may be zero while companionship
        succeeds. Account supplies once per Shanghai day, also honoring legacy receipt
        eligibility. Replayed snapshots are historical: fetch current state before
        replacing UI.'
      security: &operateCloudPetSecurity
      - bearer: []
      responses: &operateCloudPetResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody: &operateCloudPetRequestBody
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAction'
      parameters: &operateCloudPetParameters
      - *id001
      tags: &operateCloudPetTags
      - 云端养成
  /bird/v1/me/operations/{requestId}:
    get:
      operationId: getCloudOperation
      summary: getCloudOperation
      description: 404 does not prove a concurrent transaction failed; retry the same
        command ID/body. Receipts are not automatically expired.
      security: &getCloudOperationSecurity
      - bearer: []
      responses: &getCloudOperationResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters: &getCloudOperationParameters
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
      tags: &getCloudOperationTags
      - 云端养成
  /bird/v1/me/pets/{petId}/inventory-ledger:
    get:
      operationId: getCloudInventoryLedger
      summary: getCloudInventoryLedger
      description: At most 50 entries; continue using last id as exclusive beforeId.
        保留数组响应兼容；每页最多 50 条，使用末条 id/date 作为下一页 beforeId/beforeDate，排除边界；不足 50 条结束，恰好
        50 条可继续请求至空页。
      security: &getCloudInventoryLedgerSecurity
      - bearer: []
      responses: &getCloudInventoryLedgerResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters: &getCloudInventoryLedgerParameters
      - *id001
      - name: beforeId
        in: query
        schema:
          type: integer
          format: int64
          default: 9223372036854775807
      tags: &getCloudInventoryLedgerTags
      - 云端养成
  /bird/v1/me/supply-claims:
    get:
      operationId: getCloudSupplyClaims
      summary: getCloudSupplyClaims
      description: At most 50 entries; exclusive date cursor. Legacy local receipts
        never become cloud inventory. 保留数组响应兼容；每页最多 50 条，使用末条 id/date 作为下一页 beforeId/beforeDate，排除边界；不足
        50 条结束，恰好 50 条可继续请求至空页。
      security: &getCloudSupplyClaimsSecurity
      - bearer: []
      responses: &getCloudSupplyClaimsResponses
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplyClaim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters: &getCloudSupplyClaimsParameters
      - name: beforeDate
        in: query
        schema:
          type: string
          format: date
          default: '9999-12-31'
      tags: &getCloudSupplyClaimsTags
      - 云端养成
  /bird/v1/health:
    get:
      operationId: health
      summary: 进程存活检查，不保证数据库健康
      responses: &healthResponses
        '200':
          description: 正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
      tags: &healthTags
      - 实体与历史领养
  /bird/v1/analytics/page-view:
    post:
      operationId: recordPageView
      summary: 记录匿名页面浏览与浏览器 UA
      description: 仅记录允许的页面代码、随机会话标识摘要、User-Agent 与服务端时间；不记录 IP 或账号。记录按北京时间汇总，保存 90
        天。
      security: &recordPageViewSecurity []
      requestBody: &recordPageViewRequestBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - sessionId
              additionalProperties: false
              properties:
                page:
                  type: string
                  enum:
                  - home
                  - city
                  - shop
                  - profile
                  - adopt
                  - photo
                  - wardrobe
                  - flock
                sessionId:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                  description: 浏览器标签页会话随机值；服务端仅存其 SHA-256 摘要。
      responses: &recordPageViewResponses
        '204':
          description: 已记录
        '400':
          $ref: '#/components/responses/Error'
      tags: &recordPageViewTags
      - 访问统计
  /admin/v1/bird/analytics:
    get:
      operationId: getAnalyticsSummary
      summary: 查询访问统计后台汇总
      description: 需提供 ANALYTICS_ADMIN_TOKEN 配置的 Bearer 密钥。日期为北京时间自然日，查询范围最多 90 天；最近
        UA 最多返回 100 条。
      security: &getAnalyticsSummarySecurity
      - analyticsAdmin: []
      parameters: &getAnalyticsSummaryParameters
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses: &getAnalyticsSummaryResponses
        '200':
          description: 统计汇总与近期 UA
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        visits:
                          type: integer
                          format: int64
                        pageViews:
                          type: integer
                          format: int64
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page:
                          type: string
                        pageViews:
                          type: integer
                          format: int64
                  recentAgents:
                    type: array
                    items:
                      type: object
                      properties:
                        page:
                          type: string
                        userAgent:
                          type: string
                        viewedAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc-admin"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '503':
          $ref: '#/components/responses/Error'
      tags: &getAnalyticsSummaryTags
      - 访问统计
  /bird/v1/auth/register:
    post:
      operationId: register
      summary: 创建独立账号并登录
      requestBody: &registerRequestBody
        $ref: '#/components/requestBodies/Credentials'
      responses: &registerResponses
        '415':
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags: &registerTags
      - 账号与认证
  /bird/v1/auth/login:
    post:
      operationId: login
      summary: 登录并签发七天有效的随机会话令牌
      requestBody: &loginRequestBody
        $ref: '#/components/requestBodies/Credentials'
      responses: &loginResponses
        '415':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags: &loginTags
      - 账号与认证
  /bird/v1/auth/wx-login:
    post:
      operationId: wechatLogin
      summary: 用小程序临时登录码签发七天有效的会话令牌
      description: 服务端校验微信临时登录码后创建或复用数据库中的内部用户，返回稳定 userId、令牌及其固定七天到期时间。同一微信身份重新登录复用
        userId，各次会话令牌独立。身份按 AppID + OpenID 精确隔离；旧数据 AppID 须明确核实后迁移，不自动合并跨应用身份。OpenID
        和微信会话密钥不返回客户端。userId 可用于隔离本机缓存，不是鉴权凭证；后续请求以 Bearer 令牌解析的用户为准。
      security: &wechatLoginSecurity []
      requestBody: &wechatLoginRequestBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses: &wechatLoginResponses
        '200':
          description: 微信会话令牌、内部用户 ID 与 UTC 到期时间
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - userId
                - expiresAt
                properties:
                  token:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  userId:
                    $ref: '#/components/schemas/UserId'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 当前令牌固定七天到期时间，UTC；查询会话不续期。
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags: &wechatLoginTags
      - 账号与认证
  /bird/v1/auth/wx-phone-login:
    post:
      operationId: loginWechatPhone
      summary: 微信授权一键手机号登录
      description: 提交 wx.login 的 code 和 getPhoneNumber 授权事件的独立 phoneCode。 后端向微信验证身份和手机号后，复用
        AppID + OpenID 对应的内部用户及宠物存档。 不接受客户端手机号作为验证依据，不因两个微信身份使用同一手机号而合并账号。 已有账号只更新经验证的手机号，不迁移或补发资产。授权码不可重放；失败应重新授权。
        手机号仅在受控数据库保存，响应仅返回掩码；完整号码、OpenID、session_key 和 access_token 不下发。
      security: &loginWechatPhoneSecurity []
      requestBody: &loginWechatPhoneRequestBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - phoneCode
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: wx.login 返回的临时身份码
                phoneCode:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: getPhoneNumber 授权回调中的 code，与身份码不同
      responses: &loginWechatPhoneResponses
        '200':
          description: 复用原用户的登录会话及手机号掩码
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - userId
                - expiresAt
                - phoneMasked
                properties:
                  token:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  userId:
                    $ref: '#/components/schemas/UserId'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 会话固定七天到期时间
                  phoneMasked:
                    type: string
                    example: +86 **** 0000
                    description: 国家码及末四位，不含完整号码
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags: &loginWechatPhoneTags
      - 账号与认证
  /bird/v1/steps/redeem:
    post:
      operationId: redeemWechatSteps
      summary: 校验当日微信运动密文并结算叽分
      description: 同一账号在北京时间同一自然日只结算一次。同日重试返回已有额度，不再次入账。
      security: &redeemWechatStepsSecurity
      - bearer: []
      requestBody: &redeemWechatStepsRequestBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - encryptedData
              - iv
              - requestId
              properties:
                encryptedData:
                  type: string
                  minLength: 1
                  maxLength: 16384
                iv:
                  type: string
                  minLength: 1
                  maxLength: 64
                requestId:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{16,64}$
      responses: &redeemWechatStepsResponses
        '200':
          description: 当日结算结果。步数不足且未结算时 granted 为 0，claimed 为 false。
          content:
            application/json:
              schema:
                type: object
                required:
                - granted
                - steps
                - date
                - claimed
                properties:
                  granted:
                    type: integer
                    minimum: 0
                  steps:
                    type: integer
                    minimum: 0
                  date:
                    type: string
                    format: date
                  claimed:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '409':
