    SpriteAnimation:
      type: object
      additionalProperties: false
      description: 横向逐行读取，格宽和格高分别为图集宽除以列数、高除以行数。旧格式按 fps 等时播放；有时间轴时按毫秒起点取帧，末帧保持至 durationMs。图集和可选原声从同一个 releaseId 的 assets 取址。
      oneOf:
      - required: [durationMs, frameTimesMs]
      - not:
          anyOf:
          - required: [durationMs]
          - required: [frameTimesMs]
          - required: [audioAssetId]
      properties:
        durationMs:
          type: integer
          minimum: 1
          maximum: 120000
        frameTimesMs:
          type: array
          minItems: 1
          maxItems: 512
          description: 项数等于 frames，首项为零，严格递增且小于 durationMs。
          items: {type: integer, minimum: 0, maximum: 119999}
        audioAssetId:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{32}$
          description: 可选的单音轨 AAC/M4A 资源，时长与时间轴相差最多 100 ms。
        assetId: *id023
        columns:
          type: integer
          minimum: 1
          maximum: 64
        rows:
          type: integer
          minimum: 1
          maximum: 64
        frames:
          type: integer
          minimum: 1
          maximum: 512
