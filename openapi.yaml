openapi: 3.0.3
info:
  title: XCWC 小程序与运营后台 API
  version: 0.7.1
  description: XCWC H5：账号密码会话、多账号实体领养和免费立即孵化、叽分与受控合照。保持旧内部 ID；隐藏码不再参与领养。请求 Content-Type
    不受支持时返回 415 和 UNSUPPORTED_MEDIA_TYPE，不视为服务端故障。 小程序云端宠物 GET 为业务只读；未初始化返回 CLOUD_INITIALIZATION_REQUIRED，显式
    POST /me/pets/initialize 后重读。 2026-11-14 增加独立管理鉴权、内容发布、素材与账号永久装扮权益；与商品展示无自动关联。
servers:
- url: http://127.0.0.1:8080/api
  description: 本地联调地址；生产用同源 HTTPS /api
paths:
  /me/pets:
    get:
      operationId: listCloudPets
      summary: listCloudPets
      description: 业务只读，包括 HEAD；仅计算服务端时间衰减投影，不创建库存、流水或开启云端标记。账号或可信绑定未初始化返回 409 CLOUD_INITIALIZATION_REQUIRED。
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - 云端养成
  /me/pets/{petId}:
    get:
      operationId: getCloudPet
      summary: getCloudPet
      description: 业务只读，包括 HEAD；仅计算服务端时间衰减投影，不创建库存、流水或开启云端标记。账号或可信绑定未初始化返回 409 CLOUD_INITIALIZATION_REQUIRED。
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        name: petId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      tags:
      - 云端养成
  /me/pets/adopt:
    post:
      operationId: adoptCloudPet
      summary: adoptCloudPet
      description: Explicit confirmation only; account/entity unique binding, free
        immediate hatch and initial inventory in one transaction. Request IDs are
        unique within cloud operations per account.
      security:
      - bearer: []
      responses:
        '200':
          description: 已有资源或幂等重放；不重复发放权益
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
          headers:
            Location:
              description: 本人可读取的资源详情相对 URI
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '201':
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
          headers:
            Location:
              description: 本人可读取的资源详情相对 URI
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAdoption'
      tags:
      - 云端养成
  /me/pets/{petId}/actions:
    post:
      operationId: operateCloudPet
      summary: operateCloudPet
      description: 'Replay is checked before version. Retry uncertain results with
        original ID/body; changed payload is IDEMPOTENCY_CONFLICT. PET_VERSION_CONFLICT
        requires refresh and a newly confirmed action. Failed transactions leave no
        receipt. Successful no-ops have receipts. Rewards may be zero while companionship
        succeeds. Account supplies once per Shanghai day, also honoring legacy receipt
        eligibility. Replayed snapshots are historical: fetch current state before
        replacing UI.'
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudAction'
      parameters:
      - *id001
      tags:
      - 云端养成
  /me/operations/{requestId}:
    get:
      operationId: getCloudOperation
      summary: getCloudOperation
      description: 404 does not prove a concurrent transaction failed; retry the same
        command ID/body. Receipts are not automatically expired.
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
      tags:
      - 云端养成
  /me/pets/{petId}/inventory-ledger:
    get:
      operationId: getCloudInventoryLedger
      summary: getCloudInventoryLedger
      description: At most 50 entries; continue using last id as exclusive beforeId.
        保留数组响应兼容；每页最多 50 条，使用末条 id/date 作为下一页 beforeId/beforeDate，排除边界；不足 50 条结束，恰好
        50 条可继续请求至空页。
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - name: beforeId
        in: query
        schema:
          type: integer
          format: int64
          default: 9223372036854775807
      tags:
      - 云端养成
  /me/supply-claims:
    get:
      operationId: getCloudSupplyClaims
      summary: getCloudSupplyClaims
      description: At most 50 entries; exclusive date cursor. Legacy local receipts
        never become cloud inventory. 保留数组响应兼容；每页最多 50 条，使用末条 id/date 作为下一页 beforeId/beforeDate，排除边界；不足
        50 条结束，恰好 50 条可继续请求至空页。
      security:
      - bearer: []
      responses:
        '200':
          description: Server-authoritative result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplyClaim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - name: beforeDate
        in: query
        schema:
          type: string
          format: date
          default: '9999-12-31'
      tags:
      - 云端养成
  /health:
    get:
      operationId: health
      summary: 进程存活检查，不保证数据库健康
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
      tags:
      - 实体与历史领养
  /analytics/page-view:
    post:
      operationId: recordPageView
      summary: 记录匿名页面浏览与浏览器 UA
      description: 仅记录允许的页面代码、随机会话标识摘要、User-Agent 与服务端时间；不记录 IP 或账号。记录按北京时间汇总，保存 90
        天。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - page
              - sessionId
              additionalProperties: false
              properties:
                page:
                  type: string
                  enum:
                  - home
                  - city
                  - shop
                  - profile
                  - adopt
                  - photo
                  - wardrobe
                  - flock
                sessionId:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                  description: 浏览器标签页会话随机值；服务端仅存其 SHA-256 摘要。
      responses:
        '204':
          description: 已记录
        '400':
          $ref: '#/components/responses/Error'
      tags:
      - 访问统计
  /admin/analytics:
    get:
      operationId: getAnalyticsSummary
      summary: 查询访问统计后台汇总
      description: 需提供 ANALYTICS_ADMIN_TOKEN 配置的 Bearer 密钥。日期为北京时间自然日，查询范围最多 90 天；最近
        UA 最多返回 100 条。
      security:
      - analyticsAdmin: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 统计汇总与近期 UA
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        visits:
                          type: integer
                          format: int64
                        pageViews:
                          type: integer
                          format: int64
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page:
                          type: string
                        pageViews:
                          type: integer
                          format: int64
                  recentAgents:
                    type: array
                    items:
                      type: object
                      properties:
                        page:
                          type: string
                        userAgent:
                          type: string
                        viewedAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc-admin"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - 访问统计
  /auth/register:
    post:
      operationId: register
      summary: 创建独立账号并登录
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '415':
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - 账号与认证
  /auth/login:
    post:
      operationId: login
      summary: 登录并签发七天有效的随机会话令牌
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '415':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - 账号与认证
  /auth/wx-login:
    post:
      operationId: wechatLogin
      summary: 用小程序临时登录码签发七天有效的会话令牌
      description: 服务端校验微信临时登录码后创建或复用数据库中的内部用户，返回稳定 userId、令牌及其固定七天到期时间。同一微信身份重新登录复用
        userId，各次会话令牌独立。身份按 AppID + OpenID 精确隔离；旧数据 AppID 须明确核实后迁移，不自动合并跨应用身份。OpenID
        和微信会话密钥不返回客户端。userId 可用于隔离本机缓存，不是鉴权凭证；后续请求以 Bearer 令牌解析的用户为准。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        '200':
          description: 微信会话令牌、内部用户 ID 与 UTC 到期时间
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - userId
                - expiresAt
                properties:
                  token:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  userId:
                    $ref: '#/components/schemas/UserId'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 当前令牌固定七天到期时间，UTC；查询会话不续期。
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - 账号与认证
  /auth/wx-phone-login:
    post:
      operationId: loginWechatPhone
      summary: 微信授权一键手机号登录
      description: 提交 wx.login 的 code 和 getPhoneNumber 授权事件的独立 phoneCode。 后端向微信验证身份和手机号后，复用
        AppID + OpenID 对应的内部用户及宠物存档。 不接受客户端手机号作为验证依据，不因两个微信身份使用同一手机号而合并账号。 已有账号只更新经验证的手机号，不迁移或补发资产。授权码不可重放；失败应重新授权。
        手机号仅在受控数据库保存，响应仅返回掩码；完整号码、OpenID、session_key 和 access_token 不下发。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - phoneCode
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: wx.login 返回的临时身份码
                phoneCode:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: getPhoneNumber 授权回调中的 code，与身份码不同
      responses:
        '200':
          description: 复用原用户的登录会话及手机号掩码
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - userId
                - expiresAt
                - phoneMasked
                properties:
                  token:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  userId:
                    $ref: '#/components/schemas/UserId'
                  expiresAt:
                    type: string
                    format: date-time
                    description: 会话固定七天到期时间
                  phoneMasked:
                    type: string
                    example: +86 **** 0000
                    description: 国家码及末四位，不含完整号码
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      tags:
      - 账号与认证
  /steps/redeem:
    post:
      operationId: redeemWechatSteps
      summary: 校验当日微信运动密文并结算叽分
      description: 同一账号在北京时间同一自然日只结算一次。同日重试返回已有额度，不再次入账。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - encryptedData
              - iv
              - requestId
              properties:
                encryptedData:
                  type: string
                  minLength: 1
                  maxLength: 16384
                iv:
                  type: string
                  minLength: 1
                  maxLength: 64
                requestId:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{16,64}$
      responses:
        '200':
          description: 当日结算结果。步数不足且未结算时 granted 为 0，claimed 为 false。
          content:
            application/json:
              schema:
                type: object
                required:
                - granted
                - steps
                - date
                - claimed
                properties:
                  granted:
                    type: integer
                    minimum: 0
                  steps:
                    type: integer
                    minimum: 0
                  date:
                    type: string
                    format: date
                  claimed:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: 登录缺失或失效
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer realm="xcwc"
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '409':
          $ref: '#/components/responses/Error'
      tags:
      - 微信运动与历史补给
  /steps/preview-v2:
    post:
      operationId: previewWechatStepProgress
      summary: 预览当日微信步数与可兑换叽分
      description: 以北京时间自然日为准。每累计 1,000 步可兑换 1 叽分，已兑换档位按账号扣除。预览不入账。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatStepProgressRequest'
      responses:
        '200':
          description: 当日步数与兑换进度。预览的 granted 固定为 0。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatStepProgress'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      tags:
      - 微信运动与历史补给
  /steps/redeem-v2:
    post:
      operationId: redeemWechatStepProgress
      summary: 领取当日微信步数新增的可兑换叽分
      description: 领取时用最新微信运动密文校验步数，按账号发放所有尚未兑换的完整千步档。同一账号当日可多次领取，不扣普通摸摸额度。重试已入账的 requestId 返回原入账数，不重复入账。日期变化时返回 STEPS_DAY_CHANGED，请重新读取步数。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WechatStepProgressRequest'
              - type: object
                required: [requestId, expectedDate]
                properties:
                  requestId:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{16,64}$
                  expectedDate:
                    type: string
                    format: date
                    description: 最近读取返回的北京时间日期
      responses:
        '200':
          description: 当次入账数与结算后的当日进度。没有新增完整千步档时 granted 为 0。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatStepProgress'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
      - 微信运动与历史补给
