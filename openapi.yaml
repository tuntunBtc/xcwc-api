  /shop/products:
    get:
      operationId: listShopProducts
      summary: 公开商城商品列表，不展示销量
      description: 从校验后的 JSON 启动快照读取；只返回 enabled 商品。价格单位为人民币元；城市列表由全部启用商品生成，不随当前筛选改变。当前内置用户已确认的
        17 款商品清单（5 座城市，杭州 11 款），展示价格统一为 79.00 元并按配置读取；尚无真实购买链接时 purchaseUrl 为 null，不填演示购买链接。成功响应可公开缓存
        60 秒，弱 ETag 按最终分页表示生成；参数校验通过后，匹配 If-None-Match 返回无正文 304，错误响应不缓存。
      security: []
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: city
        in: query
        description: 可选城市编码，省略或空串表示全部；未知合法编码返回空列表
        schema:
          type: string
          pattern: ^[a-z0-9_-]{1,32}$
      - name: sort
        in: query
        schema:
          type: string
          default: default
          enum:
          - default
          - priceAsc
          - priceDesc
        description: default 按 sortOrder、id 升序；价格排序相同时按 sortOrder、id 升序，不支持销量排序
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 商品分页；超出末页返回空 items，total 为当前城市筛选后的总数
          headers:
            Cache-Control:
              $ref: '#/components/headers/ShopCacheControl'
            ETag:
              $ref: '#/components/headers/ShopETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopProductPage'
              example:
                items: []
                total: 0
                page: 1
                pageSize: 20
                cities: []
        '304':
          $ref: '#/components/responses/ShopNotModified'
        '400':
          description: 查询参数错误，code 为 INVALID_SHOP_QUERY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
      tags:
      - 商城
  /shop/products/{id}:
    get:
      operationId: getShopProduct
      summary: 公开商品详情，每款商品提供独立完整详情长图
      description: 无须登录。不存在、停用或格式错误的商品 ID 均返回同一 404，且不缓存。不返回销量字段。前端以 detailImageUrl
        展示完整长图，加购仍以稳定商品 ID 去重，购买沿用购物车至淘宝流程。成功响应可公开缓存 60 秒；匹配弱 ETag 的 If-None-Match
        返回无正文 304。配置重载后下架商品仍返回 404，不因旧 ETag 返回 304。
      security: []
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
      responses:
        '200':
          description: 启用商品
          headers:
            Cache-Control:
              $ref: '#/components/headers/ShopCacheControl'
            ETag:
              $ref: '#/components/headers/ShopETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopProduct'
        '304':
          $ref: '#/components/responses/ShopNotModified'
        '404':
          description: 商品不存在或已下架，code 为 SHOP_PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
      tags:
      - 商城
  /shop/banners:
    get:
      operationId: listShopBanners
      summary: 公开商城轮播图，仅图片不跳转
      description: 按配置 sortOrder、id 升序返回启用图片；不提供跳转链接。内置首张已批准的“小黄莺的小店”主题轮播图；显式空配置可返回空
