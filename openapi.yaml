          properties:
            satiety:
              type: integer
              minimum: 0
              maximum: 100
            hydration:
              type: integer
              minimum: 0
              maximum: 100
            mood:
              type: integer
              minimum: 20
              maximum: 100
            lastCompanionAt:
              type: string
              format: date-time
        inventory:
          type: object
          required:
          - food
          - water
          properties:
            food:
              type: integer
              minimum: 0
            water:
              type: integer
              minimum: 0
        cleaning:
          type: object
          required:
          - type
          - status
          - dueAt
          properties:
            type:
              type: string
              enum:
              - POOP
            status:
              type: string
              enum:
              - NONE
              - PENDING
              - PRESENT
            dueAt:
              type: string
              format: date-time
              nullable: true
        supplyClaimed:
          type: boolean
        characterId:
          description: 实体映射到的稳定角色 ID。旧实体未映射时为 null，历史回执可缺省。客户端此时使用本地素材。
          type: string
          pattern: ^[A-Za-z0-9_-]{1,32}$
          nullable: true
        contentVersion:
          description: 读取宠物时所见的全局内容发布 ID，对应角色清单的 releaseId。回滚会生成新 ID，客户端按相等性判断，按角色清单实际返回的版本缓存。
          type: string
          nullable: true
    PetSpark:
      type: object
      description: 主人与此 petId 的续火花状态，按快照 businessDate（北京时间自然日）计算。
      required: [status, level, affinity, effectiveToday, frozenLevel, recoveryProgress, recoveryDeadline]
      properties:
        status:
          type: string
          enum: [UNLIT, ACTIVE, RECOVERABLE, RECOVERING, EXPIRED]
        level:
          type: integer
          format: int64
          minimum: 0
          description: 当前火花天数；恢复时等于冻结等级，未点亮或已到期为 0。
        affinity:
          type: integer
          format: int64
          minimum: 0
          description: 累计有效互动日；中断、恢复失败和重新点亮均不扣除。
        effectiveToday:
          type: boolean
          description: 快照业务日已计入一次有效互动。
        frozenLevel:
          type: integer
          format: int64
          minimum: 0
          description: 可恢复或恢复中时的冻结等级，其余状态为 0。
        recoveryProgress:
          type: integer
          minimum: 0
          maximum: 2
          description: 仅恢复中为 1 或 2；第 3 天结算后转为 ACTIVE 并清零。
        recoveryDeadline:
          type: string
          format: date
          nullable: true
          description: 原窗口内可开始恢复的最后一个北京时间自然日，含当日。已开始且保持连续的恢复可跨过该日期。非恢复状态为空。
