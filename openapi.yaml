        detailCrop:
          $ref: '#/components/schemas/ShopImageRect'
        closeHotspot:
          $ref: '#/components/schemas/ShopCloseHotspot'
    ShopCloseHotspot:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 完整详情图内关闭按钮的透明点击区，相对 detailCrop 裁后展示图的宽高比例。复用图片范围校验；省略时使用兼容原四款截图的默认位置，每款不同布局可独立配置。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
          default: 0.837
        top:
          type: number
          minimum: 0
          maximum: 1
          default: 0.0555
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.085
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.046
    ShopImageRect:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 仅影响前端显示窗口，不改写原图。裁剪相对原文件宽高的 0–1 比例，范围不可超出图片；缺省返回整图 (0,0,1,1)。cartHotspot
        与 closeHotspot 坐标均相对于 detailCrop 裁后展示的完整详情图。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
        top:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
    ShopCartHotspot:
      type: object
      additionalProperties: false
      required:
      - left
      - top
      - width
      - height
      description: 完整详情长图已含加购按钮，前端仅叠加透明点击区。坐标均为图片宽高的 0–1 比例；left+width、top+height
        不可超过 1。配置省略时归一为默认定稿位置。
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
          default: 0.08
        top:
