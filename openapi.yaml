          minimum: 0
          maximum: 1
          default: 0.87
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.84
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          default: 0.08
