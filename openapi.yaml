          maxLength: 2048
          description: 未配置真实购买链接时为 null，商品仍可展示和加购，前端禁用该商品购买按钮并提示链接待配置。非 null 时仅允许
            HTTPS 的 e.tb.cn、item.taobao.com、detail.tmall.com，禁止用户名信息和非标准端口。购买不触发站内支付或发蛋
