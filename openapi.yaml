  /admin/v1/oss/uploads:
    post:
      operationId: uploadPublicOperationalImage
      summary: 上传公开运营图片或 MP4 视频到 OSS
      description: 管理员需 content:edit 权限。PNG/JPEG/WebP 图片与 MP4 视频单文件最多 50 MiB（52,428,800 字节），multipart 请求最多 52 MiB。图片仍校验实际格式、完整解码、8192×8192 边长及 2400 万像素。视频需启用 OSS_UPLOAD_VIDEO_ENABLED=true，仅接受 H.264/8-bit yuv420p 或 HEVC/H.265 的 8-bit yuv420p、10-bit yuv420p10le、可选单条 AAC 双声道音轨的 MP4，最长 180 秒、最长边 1920/短边 1080、最高 60 fps；不接收 MOV/WebM、12-bit 或 4:2:2/4:4:4 视频，不自动转码；HEVC 原字节公开读取不等于已验证所有客户端播放兼容。使用受限本地 ffprobe 先检查元数据，再解码开头最多 1 秒，不声称完整解码全片。文件名与客户端 MIME 不作为格式依据。保留原字节，通过私有临时文件流式上传、OSS 读回和匿名 HTTPS 全文件 SHA256/MIME/字节数校验后才返回 201。仅一个上传可进入 multipart 处理，忙时 429。新上传素材全部公开，URL 无签名和过期参数，不公开历史私有原件、草稿或用户照片。失败不返回成功 URL；重试创建独立资源，不覆盖。公开地址为 Java 代理私有 OSS，不代表 OSS 直出或 CDN。
      tags: [运营素材]
      security:
      - adminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG/JPEG/WebP 图片或启用后支持的 MP4 视频，最多 50 MiB；文件名和客户端声明的 MIME 不作为格式校验依据。
      responses:
        '201':
          description: 已验证匿名 HTTPS 下载可用，元数据及成功审计已提交
          headers:
            Location:
              schema: {type: string, format: uri}
              description: 与响应 url 相同的完整公开 HTTPS URL，无过期参数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOperationalUpload'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          description: 当前上传处理忙，返回 OSS_UPLOAD_BUSY，稍后重试
          headers:
            Retry-After:
              schema: {type: string, example: '1'}
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error/content/application~1json/schema'
        '503':
          description: OSS 未配置、写入/读回失败、临时磁盘不可用或匿名 HTTPS 校验失败。探针缺失为 PUBLIC_VIDEO_VALIDATOR_UNAVAILABLE；失败响应不包含成功 URL。
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error/content/application~1json/schema'
  /bird/v1/oss/uploads/{filename}:
    get:
      operationId: readPublicOperationalImage
      summary: 匿名读取新上传的公开运营图片或视频
      description: 从私有 OSS 下载到私有临时文件并流式校验全文件 SHA256/大小，再输出响应；只读取已登记资源。成功资源长期不可变缓存，验证中的读取为 no-store，失败或验证过期为 404。支持 HEAD、If-None-Match、单段 bytes Range 和强 ETag If-Range；部分读取 206，无效或多段范围 416。最多两个普通下载和一个独立自验证下载，繁忙为 503 + Retry-After。响应结束、断连或错误均清理临时文件并归还名额。URL 持续可用依赖保留对象、元数据、域名及此服务。
      tags: [运营素材]
      security: []
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{32}\.(png|jpg|webp|mp4)$'
      - name: Range
        in: header
        schema: {type: string, example: 'bytes=0-1023'}
        description: 可选单段字节范围，支持起点到末尾及后缀范围。
      - name: If-Range
        in: header
        schema: {type: string}
        description: 仅强 ETag 匹配时返回范围，否则返回完整 200。
      - name: If-None-Match
        in: header
        schema: {type: string}
        description: READY 资源 ETag 匹配时返回 304。
      responses:
        '200':
          description: 图片或视频完整字节，MIME 取已校验的上传元数据
          headers:
            Accept-Ranges:
              schema: {type: string, example: bytes}
            Content-Length:
              schema: {type: integer, format: int64}
            Cache-Control:
              schema: {type: string}
              description: 已完成资源为 public, max-age=31536000, immutable；上传验证期间为 no-store。
            ETag:
              schema: {type: string}
              description: 带引号的 SHA-256。
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
        '206':
          description: 单段范围字节，包含 Content-Range、Content-Length、Accept-Ranges 和完整文件 ETag。
          headers:
            Content-Range:
              schema: {type: string, example: 'bytes 0-1023/14680064'}
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        '304':
          description: READY 资源 ETag 未变化，无响应体。
        '416':
          description: 范围无效或多段范围，无响应体且不缓存。
          headers:
            Content-Range:
              schema: {type: string, example: 'bytes */14680064'}
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    head:
      operationId: headPublicOperationalUpload
      summary: 匿名读取公开运营图片或视频的响应头
      tags: [运营素材]
      security: []
      description: 与 GET 相同的资源校验和范围语义，不返回响应体。可传 Range、If-Range 和 If-None-Match。
      parameters:
      - name: filename
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{32}\.(png|jpg|webp|mp4)$'}
      responses:
        '200':
          description: 返回实际 MIME、Content-Length、Accept-Ranges、ETag 和缓存头，无响应体。
        '206':
          description: 返回有效范围的 Content-Range/Content-Length，无响应体。
        '304':
          description: 未变化，无响应体。
        '416':
          description: 范围无效，无响应体。
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /test/bird/v1/oss/uploads/{filename}:
    parameters:
    - {in: path, name: filename, required: true, schema: {type: string}}
    get:
      operationId: getNestTestUpload
      summary: 测试环境读取独立前缀下的运营素材，支持 Range
      security: []
      responses: &nestAssetResponses
        '200': {description: 完整文件}
        '206': {description: 请求的字节区间}
        '304': {description: 缓存有效}
        '404': {description: 未启用或未找到文件}
        '416': {description: 字节区间错误}
    head:
      operationId: headNestTestUpload
      summary: 读取测试运营素材响应头
      security: []
      responses: *nestAssetResponses
  /admin/v1/bird/brand-ips/{id}/nest-interactions:
    parameters: &nestParameters
    - {name: id, in: path, required: true, schema: {type: string}, description: 稳定的小鸟角色 ID}
    get:
      operationId: getNestInteractionDraft
      summary: 测试环境读取单只鸟的小窝互动草稿
      description: 测试专用开关默认关闭。需 brand:read。首次读取返回零版本和空动作数组。
      security: [{adminBearer: []}]
      responses:
        '200': &nestResponse
          description: 当前内容版本和素材绑定
          content: {application/json: {schema: {$ref: '#/components/schemas/NestInteractionView'}}}
        '401': {description: 未登录}
        '403': {description: 缺少权限}
        '404': {description: 未启用或角色不存在}
    put:
      operationId: saveNestInteractionDraft
      summary: 测试环境按版本保存整鸟草稿
      description: 需 brand:edit。相同草稿不增加版本。视频及首尾帧引用已验证 OSS 上传记录的 ID，服务端生成 URL 和视频内容编码；已有视频和帧时尺寸须一致。enabled 为草稿动作启用意图。
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, actions]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
                actions: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/NestInteractionAction'}}
      responses:
        '200': *nestResponse
        '400': {description: 素材引用、尺寸或动作配置错误}
        '401': {description: 未登录}
        '403': {description: 缺少权限}
        '404': {description: 未启用或角色不存在}
        '409': {description: 草稿版本已改变，请重新读取}
  /admin/v1/bird/brand-ips/{id}/nest-interactions/publish:
    parameters: *nestParameters
    post:
      operationId: publishNestInteractions
      summary: 测试环境发布当前角色草稿
      description: 需 brand:publish。启用的动作须有视频及首尾帧；同一版本重复发布不写入。成功后返回管理草稿及最新发布版本。
      security: [{adminBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties: {expectedVersion: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': *nestResponse
        '400': {description: 草稿未准备好}
        '401': {description: 未登录}
        '403': {description: 缺少权限}
        '404': {description: 未启用或角色不存在}
        '409': {description: 草稿版本已改变}
  /bird/v1/nest-interactions/{id}:
    parameters: *nestParameters
    get:
      operationId: getPublishedNestInteractions
      summary: 测试小程序读取已发布互动配置
      description: 网关测试前缀为 /test。返回网站已发布角色的互动快照，只包含启用的动作；响应的 version 与 publishedVersion 相同。
      security: []
      responses:
        '200': *nestResponse
        '404': {description: 未启用、角色未发布或尚无已发布配置}
components:
  headers:
    ShopCacheControl:
      description: 公开商城成功响应可缓存 60 秒；过期后须重新验证。其他接口与错误响应沿用 no-store。
      schema:
        type: string
        example: public, max-age=60, must-revalidate
    ShopETag:
      description: 当前响应 JSON 表示的弱 SHA-256 校验值；筛选、分页或商品资料变化导致表示变化时更新。
      schema:
        type: string
        example: W/"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 随机不透明令牌，不是 JWT；数据库仅存摘要
    analyticsAdmin:
      type: http
      scheme: bearer
      description: 独立后台密钥，由服务端 ANALYTICS_ADMIN_TOKEN 配置；不可使用普通账号会话令牌。
    adminBearer:
      type: http
      scheme: bearer
      description: 独立管理会话，adm_ 前缀；不接受小程序令牌。
    previewToken:
      type: apiKey
      in: header
      name: X-Preview-Token
      description: 授权生成的 15 分钟只读草稿凭据；不记录至 URL 或日志。
  parameters:
    DiaryPetId:
      name: petId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      description: 当前登录账号的宠物领养关系 ID。
    DiaryBusinessDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
      description: 北京时间自然日。
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次 ETag；支持弱比较、逗号分隔列表和 *。先校验查询及商品存在性，再判断是否返回 304。
      schema:
        type: string
    BirdId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 32 位小写十六进制随机公开 ID；未知 ID 返回 404
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - username
            - password
            properties:
              username:
                type: string
                pattern: ^[a-z0-9_]{4,32}$
              password:
                type: string
                minLength: 10
                maxLength: 72
                description: 同时要求 UTF-8 编码最多 72 字节；密码不可找回
  schemas:
    NestInteractionView:
      type: object
      required: [characterId, version, publishedVersion, actions]
      properties:
        characterId: {type: string}
        version: {type: integer, format: int64}
        publishedVersion: {type: integer, format: int64}
        actions: {type: array, items: {$ref: '#/components/schemas/NestInteractionAction'}}
    NestInteractionAction:
      type: object
      required: [actionCode, name, group, enabled, sound]
      properties:
        actionCode: {type: string, description: '固定编码 awake_idle、fall_asleep、sleep_idle、wake_up、head_pat、eat、drink、angry，或 food-/emotion- 加 32 位小写十六进制 ID'}
        name: {type: string, maxLength: 20}
        group: {type: string, enum: [daily, food, emotion]}
        enabled: {type: boolean}
        sound: {type: boolean}
        videoId: &nestAsset {type: string, pattern: '^[0-9a-f]{32}$', nullable: true}
        firstFrameId: *nestAsset
        lastFrameId: *nestAsset
        videoCode: {type: string, nullable: true, readOnly: true, description: 'vid_ 加视频 SHA-256'}
        videoUrl: &nestURL {type: string, format: uri, readOnly: true, nullable: true}
        firstFrameUrl: *nestURL
        lastFrameUrl: *nestURL
    PetDiaryCalendar:
      type: object
      required: [today, days]
      properties:
        today: { type: string, format: date }
        days:
          type: array
          items:
            $ref: '#/components/schemas/PetDiaryDaySummary'
    PetDiaryDaySummary:
      type: object
      required: [date, kind, mood, activities, unreadCount]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [home, travel, study] }
        mood: { type: string, enum: [calm, curious, happy, proud, content] }
        activities:
          type: array
          items:
            $ref: '#/components/schemas/PetDiaryActivity'
        unreadCount: { type: integer, format: int64, minimum: 0 }
    PetDiaryDay:
      allOf:
      - $ref: '#/components/schemas/PetDiaryDaySummary'
      - type: object
        required: [title, text, letters]
        properties:
          title: { type: string, maxLength: 120 }
          text: { type: string, maxLength: 1000 }
          letters:
            type: array
            items:
              $ref: '#/components/schemas/PetDiaryLetter'
    PetDiaryActivity:
      type: object
      description: 来自可信旅行或学习业务事件的记录，同一天可同时记录多个活动。
      required: [kind, title, text]
      properties:
        kind: { type: string, enum: [travel, study] }
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 1000 }
    PetDiaryLetter:
      type: object
      required: [id, text, reply, createdAt, readAt]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        text: { type: string, maxLength: 500 }
        reply: { type: string, maxLength: 800 }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    PetDiaryLetterRequest:
      type: object
      additionalProperties: false
      required: [requestId, text]
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        text: { type: string, minLength: 1, maxLength: 500 }
    PublicOperationalUpload:
      type: object
      additionalProperties: false
      required: [id, url, mime, width, height, size, sha256]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        url:
          type: string
          format: uri
          example: https://assets.xinchengip.com/bird/v1/oss/uploads/0123456789abcdef0123456789abcdef.png
          description: 已完成匿名读取验证的完整 HTTPS URL，无签名和过期参数。
        mime:
          type: string
          enum: [image/png, image/jpeg, image/webp, video/mp4]
        width:
          type: integer
          minimum: 1
          maximum: 8192
        height:
          type: integer
          minimum: 1
          maximum: 8192
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
          description: 上传图片或视频原始字节数，单文件最多 50 MiB。
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    BrandIpExpression:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - name
      - assetId
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
        type:
          type: string
          enum:
          - normal
          - happy
          - hungry
          - thirsty
          - lonely
          - shy
          - angry
          - crying
          - confused
          - veryHappy
        name:
          type: string
          minLength: 1
          maxLength: 60
        assetId:
          type: string
          description: 素材 ID；空字符串表示未配置草稿
        listed:
          type: boolean
          description: 此表情在草稿中的上架状态，发布后生效。历史草稿省略此字段时，已配置素材按上架处理。可选表情下架后保留素材，发布槽位使用正常图兜底；正常图必须有素材且已上架。
    BrandIpInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        code:
          type: string
          maxLength: 32
          description: 实体角色编码，创建可省略自动生成，正式发布后不可改变
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 60
          description: 归属城市，服务端去除末尾市并生成稳定内部城市代码，不是行政区划代码
        coverAssetId:
          type: string
        backgroundAssetId:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{32}$'
          description: 小窝背景图片的内容素材 ID。省略保留原配置，传 null 清除并回退至公共背景。保存草稿后需发布才生效。
        expressions:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/BrandIpExpression'
        animation:
          description: 省略沿用原动画，传 null 移除。配置入口仅在 animationEditingEnabled 为真时开放。
          oneOf:
          - $ref: '#/components/schemas/SpriteAnimation'
          - {type: object, nullable: true, enum: [null]}
    BrandIpDetail:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 60
          description: 归属城市，服务端去除末尾市并生成稳定内部城市代码，不是行政区划代码
        coverAssetId:
          type: string
        backgroundAssetId:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{32}$'
          description: 当前品牌 IP 草稿中配置的小窝背景，null 表示使用公共背景。
        mainAssetId:
          type: string
          description: First configured expression image in fixed state order, or empty.
        expressions:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/BrandIpExpression'
        id:
          type: string
        code:
          type: string
        cityCode:
          type: string
        status:
          type: string
          enum:
          - new
          - listed
          - delisted
        dirty:
          type: boolean
        configured:
          type: integer
        draftVersion:
          type: string
        stateVersion:
          type: string
        updatedAt:
          type: string
        mappedEntities:
          type: integer
        unmappedEntities:
          type: integer
        animationEditingEnabled:
          type: boolean
        animation:
          description: 省略沿用原动画，传 null 移除。配置入口仅在 animationEditingEnabled 为真时开放。
          oneOf:
          - $ref: '#/components/schemas/SpriteAnimation'
          - {type: object, nullable: true, enum: [null]}
    BrandIpAction:
      type: object
      required:
      - action
      - draftVersion
      - stateVersion
      - requestId
      properties:
        action:
          type: string
          enum:
          - publish
          - list
          - delist
          - rollback
        draftVersion:
          type: string
        stateVersion:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        releaseId:
          type: string
    WechatStepProgressRequest:
      type: object
      required: [encryptedData, iv]
      properties:
        encryptedData:
          type: string
          minLength: 1
          maxLength: 16384
        iv:
          type: string
          minLength: 1
          maxLength: 64
    WechatStepProgress:
      type: object
      required: [date, steps, stepPointsAvailable, stepPointsRedeemed, granted, replayed]
      properties:
        date:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
        stepPointsAvailable:
          type: integer
          minimum: 0
          description: 按本次验证步数计算，当前尚可兑换的叽分
        stepPointsRedeemed:
          type: integer
          minimum: 0
          description: 账号今日已从步数兑换的叽分总数
        granted:
          type: integer
          minimum: 0
          description: 当前请求首次入账的额度，已入账请求重试时返回原额度
        replayed:
          type: boolean
          description: 当前请求是否返回既有入账回执
    CloudAdoption:
      type: object
      additionalProperties: false
      required:
      - requestId
      - birdId
      - nickname
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        birdId:
          type: string
          pattern: ^[0-9a-f]{32}$
        nickname:
          type: string
          minLength: 1
          maxLength: 6
    CloudAction:
      type: object
      additionalProperties: false
      required:
      - requestId
      - expectedVersion
      - action
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        expectedVersion:
          type: string
          pattern: ^[0-9]{1,18}$
        action:
          type: string
          enum:
          - RENAME
          - FEED
          - WATER
          - PET
          - CLEAN
          - CLAIM_SUPPLY
        nickname:
          type: string
          minLength: 1
          maxLength: 6
          description: Only for RENAME.
        expectedDate:
          type: string
          format: date
          description: Required for CLAIM_SUPPLY; server Asia/Shanghai business date.
    CloudWallet:
      type: object
      required:
      - balance
      - accountVersion
      properties:
        balance:
          type: integer
          format: int64
        accountVersion:
          type: string
    CloudPet:
      type: object
      description: 当前快照保留 normal-v1 养成规则，续火花作为独立能力。旧服务或历史回执可同时省略 sparkRuleVersion 和 spark；出现其中一个字段时两个都必须有效。
      oneOf:
      - required: [sparkRuleVersion, spark]
      - not:
          anyOf:
          - required: [sparkRuleVersion]
          - required: [spark]
      required:
      - petId
      - birdId
      - nickname
      - active
      - version
      - ruleVersion
      - serverTime
      - businessDate
      - care
      - inventory
      - cleaning
      - supplyClaimed
      properties:
        petId:
          type: string
        birdId:
          type: string
        birdCode:
          type: string
          nullable: true
        nickname:
          type: string
        active:
          type: boolean
        version:
          type: string
        ruleVersion:
          type: string
          enum:
          - normal-v1
        sparkRuleVersion:
          type: string
          enum: [spark-v1]
        spark:
          $ref: '#/components/schemas/PetSpark'
        serverTime:
          type: string
          format: date-time
        businessDate:
          type: string
          format: date
